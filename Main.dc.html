.detail-progress{color:#a0a0a0;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.detail-progress span{color:#5a5a5a}
.detail-stage-wrap{display:flex;justify-content:center;align-items:center;min-width:0}
.dv{overflow-y:auto;overflow-x:hidden}
.detail-bob{position:relative;width:fit-content;max-width:100%}
.detail-side{display:flex;flex-direction:column;gap:0;width:100%;min-width:0}
.ov.on .detail-stage{animation:detailStageIn 1.1s cubic-bezier(.2,.8,.2,1) both .15s}
.ov.on .detail-rise{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.dtext>*{margin:0}
.review-panel{position:relative;padding:0;border:0}
.review-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.review-eyebrow{margin:0 0 8px;color:#a0a0a0;font-size:10px;letter-spacing:.24em;text-transform:uppercase}
.review-title{margin:0;color:#f4f4f4;font-family:'Cormorant Garamond',serif;font-size:34px;font-style:italic;font-weight:300;line-height:1}
.review-form{display:grid;gap:12px;margin-top:14px}
.review-label,.review-rating legend{display:block;margin-bottom:8px;color:#b8b8b8;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.review-name{box-sizing:border-box;width:100%;height:48px;padding:0 16px;border:1px solid #3a3a3a;border-radius:10px;background:#0c0c0c;color:#f4f4f4;font:inherit;font-size:14px;letter-spacing:.04em;cursor:text;transition:border-color .3s ease,background .3s ease}
.review-name::placeholder{color:#707070}
.review-name:hover{border-color:#6a6a6a}
.review-name:focus-visible{outline:2px solid #f4f4f4;outline-offset:3px;border-color:#d8d8d8}
.review-rating{margin:0;padding:0;border:0}
.rating-picker{display:flex;gap:2px;margin-left:-6px}
.rating-choice{position:relative;display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.rating-choice input{position:absolute;width:1px;height:1px;opacity:0}
.rating-choice span[aria-hidden]{color:transparent;font-size:29px;line-height:1;-webkit-text-stroke:1px #d0d0d0;transition:color .25s ease}
.rating-choice.is-selected span[aria-hidden],.rating-choice.is-hovered span[aria-hidden],.rating-choice:hover span[aria-hidden]{color:#f4f4f4}
.rating-choice:hover{transform:scale(1.3) rotate(-8deg)}
.rating-choice input:focus-visible+span[aria-hidden]{outline:1px solid #f4f4f4;outline-offset:4px}
.review-submit{justify-self:start;height:48px;padding:0 24px;border:0;border-radius:999px;background:#f4f4f4;color:#111;font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s ease}
.review-submit:hover{background:#f4f4f4;transform:translateY(-3px);box-shadow:0 12px 30px -10px #fff8}
.review-submit:active{transform:translateY(0) scale(.97)}
.review-submit:disabled{opacity:.55;cursor:wait;transform:none}
.review-status{min-height:1.5em;margin:0;color:#c6b18b;font-size:11px;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.tbtn svg{flex:none}
.tbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:#d8d8d8;font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tbtn[aria-pressed="true"]{background:#f4f4f4;color:#111}
.tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.scroll-top{position:fixed;right:24px;bottom:24px;z-index:70;width:48px;height:48px;padding:0;justify-content:center;border:1px solid #777;background:#0d0d0dcc;color:#f4f4f4;font-size:24px;line-height:1;letter-spacing:0;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease,visibility .25s ease;backdrop-filter:blur(8px)}
.scroll-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
.scroll-top:hover{background:#f4f4f4;color:#111}
#sketchRoot{-webkit-user-select:none;user-select:none}
@media (max-width:720px){.tools{flex-wrap:wrap;border-radius:22px!important;max-width:calc(100% - 40px)}}
@media (max-width:900px){
html{scroll-behavior:auto!important}
body{background-color:#080808}
body.detail-open{overflow-x:hidden}
body.detail-open main{display:none}
body.detail-open #sketchRoot{height:auto!important;min-height:100vh;overflow:visible!important}
.ov.dv:not(.on){display:none}
.ov.dv{position:relative;inset:auto;height:auto;min-height:100vh;overflow:visible;transition:none}
.ov.dv.on{transition:none}
.dv{overflow:visible;background-color:#080808;background-image:radial-gradient(ellipse at 27% 30%,#1c1c1c 0,transparent 56%)}
.detail-ambience{display:none}
.detail-grid{isolation:isolate;grid-template-columns:minmax(0,1fr);gap:70px;min-height:100vh;padding:110px 28px 70px}
.detail-grid::before{position:absolute;inset:0;z-index:0;pointer-events:none;content:"";background:radial-gradient(ellipse at 27% 26%,#202020 0,transparent 50%)}
.detail-grid>:not(.mobile-detail-waves){position:relative;z-index:1}
.detail-grid>.mobile-detail-waves{position:absolute;right:0;bottom:0;left:0;z-index:0;display:block;width:100%;height:220px;pointer-events:none;opacity:.65}
.ov.on .detail-stage,.ov.on .detail-rise,.detail-bob,.detail-ghostnum,.detail-outline,.detail-ripple,.detail-orbit{animation:none!important;filter:none!important}
.detail-rise{opacity:1!important;transform:none!important}
.detail-bob{transform:none!important}
.detail-outline,.detail-ghostnum,.detail-ring-wrap{display:none}
.detail-stage-wrap{min-height:0}
.dpaper img{max-height:min(62vh,560px);box-shadow:0 18px 36px -28px #000}
.detail-grain{display:none}
.gallery-main{padding-bottom:56px!important}
.gallery-main h1{filter:none!important}
.gallery-main .reveal{animation:none!important;animation-timeline:auto!important;animation-range:normal!important;opacity:1!important;transform:none!important}
.gallery-main .frame{animation:none!important;transform:none!important}
}
@media (max-width:600px){.detail-grid{gap:52px;padding:100px 24px 60px}.dpaper{max-width:calc(100% - 48px)}.detail-topbar{padding:16px 18px}.review-heading{gap:12px}.review-title{font-size:30px}}
@media (any-pointer:coarse){#pencilBtn,#eraserBtn,#clearBtn,#drawHint{display:none}}
@media (prefers-reduced-motion:reduce){.rm-on,.rm-on *{animation:none!important;transition:none!important}}
html.motion-off,html.motion-off *{animation:none!important;transition:none!important}
html.motion-off *,html.motion-off *::before,html.motion-off *::after{-webkit-animation:none!important}
</style>
</helmet>
